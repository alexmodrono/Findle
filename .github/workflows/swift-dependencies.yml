name: Swift dependency proposals

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-dependency-proposals
  cancel-in-progress: false

jobs:
  discover:
    name: Discover compatible Swift updates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Propose version and immutable revision updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/update-swift-dependency.py --discover --output "$RUNNER_TEMP/dependencies" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain reviewable proposals
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: swift-dependency-proposals
          path: ${{ runner.temp }}/dependencies
          retention-days: 14
          if-no-files-found: error
