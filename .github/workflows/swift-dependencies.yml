name: Swift dependency proposals

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: swift-dependency-proposals
  cancel-in-progress: false

jobs:
  discover:
    name: Discover compatible Swift updates
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Propose version and immutable revision updates
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -o pipefail
          python3 scripts/update-swift-dependency.py --discover --output "$RUNNER_TEMP/dependencies" \
            | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Retain reviewable proposals
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: swift-dependency-proposals
          path: ${{ runner.temp }}/dependencies
          retention-days: 14
          if-no-files-found: error
