name: Stage release candidate

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: findle-release
  cancel-in-progress: false

env:
  APP_NAME: Findle
  SCHEME: Findle
  BUNDLE_ID: es.amodrono.findle
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  stage:
    environment: release-candidate
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      attestations: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Extract version from tag
        id: version
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Require tested source on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          python3 scripts/require-release-ci.py "$GITHUB_SHA"
          bash scripts/ci-preflight.sh

      - name: Install verified release tools before importing signing credentials
        run: |
          bash scripts/install-ci-tools.sh
          bash scripts/install-release-tools.sh

      - name: Import signing certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          echo -n "$CERTIFICATE_P12_BASE64" | base64 --decode -o "$CERT_PATH"

          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain

      - name: Install provisioning profiles
        env:
          APP_PROVISION_PROFILE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          FILEPROVIDER_PROVISION_PROFILE_BASE64: ${{ secrets.FILEPROVIDER_PROVISION_PROFILE_BASE64 }}
        run: |
          PROFILES_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PROFILES_DIR"

          echo -n "$APP_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/app.provisionprofile"
          echo -n "$FILEPROVIDER_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILES_DIR/fileprovider.provisionprofile"

          APP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILES_DIR/app.provisionprofile")")
          FP_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" /dev/stdin <<< "$(security cms -D -i "$PROFILES_DIR/fileprovider.provisionprofile")")

          mv "$PROFILES_DIR/app.provisionprofile" "$PROFILES_DIR/$APP_UUID.provisionprofile"
          mv "$PROFILES_DIR/fileprovider.provisionprofile" "$PROFILES_DIR/$FP_UUID.provisionprofile"

          echo "APP_PROFILE_UUID=$APP_UUID" >> "$GITHUB_ENV"
          echo "FP_PROFILE_UUID=$FP_UUID" >> "$GITHUB_ENV"

      - name: Write signing xcconfig files
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain"

          # Append signing overrides; retain release optimization and archive settings.
          cat >> Config/Release-App.xcconfig <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Developer ID Application
          DEVELOPMENT_TEAM = ${{ secrets.TEAM_ID }}
          PROVISIONING_PROFILE = $APP_PROFILE_UUID
          OTHER_CODE_SIGN_FLAGS = --keychain $KEYCHAIN_PATH
          XCCONFIG

          cat >> Config/Release-FileProvider.xcconfig <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Developer ID Application
          DEVELOPMENT_TEAM = ${{ secrets.TEAM_ID }}
          PROVISIONING_PROFILE = $FP_PROFILE_UUID
          OTHER_CODE_SIGN_FLAGS = --keychain $KEYCHAIN_PATH
          XCCONFIG

          cat >> Config/Release-Framework.xcconfig <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Developer ID Application
          DEVELOPMENT_TEAM = ${{ secrets.TEAM_ID }}
          OTHER_CODE_SIGN_FLAGS = --keychain $KEYCHAIN_PATH
          XCCONFIG

          # The bundled MCP helper (FindleMCP) ships inside the app's Contents/MacOS.
          # It must be Developer ID-signed with the same team as the embedded
          # frameworks, or the hardened runtime's library validation refuses to
          # load SharedDomain/FindlePersistence at runtime (and notarization
          # rejects an ad-hoc nested executable). A CLI tool needs no provisioning
          # profile. Overwrites the gitignored local include used for dev builds.
          cat > Config/MCP.xcconfig <<XCCONFIG
          CODE_SIGN_STYLE = Manual
          CODE_SIGN_IDENTITY = Developer ID Application
          DEVELOPMENT_TEAM = ${{ secrets.TEAM_ID }}
          OTHER_CODE_SIGN_FLAGS = --keychain $KEYCHAIN_PATH
          XCCONFIG

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Set version in Info.plist
        run: |
          for plist in Resources/Info/App-Info.plist Resources/Info/FileProvider-Info.plist Resources/Info/Framework-Info.plist; do
            /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${{ steps.version.outputs.version }}" "$plist"
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" "$plist"
          done

      - name: Build archive
        run: |
          xcodebuild archive \
            -project Findle.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -disableAutomaticPackageResolution \
            -onlyUsePackageVersionsFromResolvedFile \
            FINDLE_SOURCE_REVISION="$GITHUB_SHA" \
            -derivedDataPath "$RUNNER_TEMP/ReleaseDerivedData" \
            -archivePath "$RUNNER_TEMP/Findle.xcarchive"

      - name: Export archive
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>${{ secrets.TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>es.amodrono.findle</key>
                  <string>${APP_PROFILE_UUID}</string>
                  <key>es.amodrono.findle.file-provider</key>
                  <string>${FP_PROFILE_UUID}</string>
              </dict>
          </dict>
          </plist>
          EOF

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Findle.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize app
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          APP_PATH="$RUNNER_TEMP/export/$APP_NAME.app"

          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"

          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" \
            --team-id "$TEAM_ID" \
            --wait

          xcrun stapler staple "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          spctl --assess --type execute --verbose=2 "$APP_PATH"

      - name: Verify bundle identity and entitlements
        env:
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          python3 scripts/release-candidate.py app \
            --app "$RUNNER_TEMP/export/$APP_NAME.app" \
            --version "${{ steps.version.outputs.version }}" --build "$GITHUB_RUN_NUMBER" \
            --revision "$GITHUB_SHA" --team "$TEAM_ID" --symbols "$RUNNER_TEMP/Findle.xcarchive/dSYMs"

      - name: Create DMG
        run: |
          create-dmg \
            --volname "$APP_NAME" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --icon "$APP_NAME.app" 150 185 \
            --app-drop-link 450 185 \
            --hide-extension "$APP_NAME.app" \
            "$RUNNER_TEMP/$APP_NAME-${{ steps.version.outputs.version }}.dmg" \
            "$RUNNER_TEMP/export/$APP_NAME.app"

      - name: Sign and notarize the disk image
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          TEAM_ID: ${{ secrets.TEAM_ID }}
        run: |
          DMG="$RUNNER_TEMP/$APP_NAME-${{ steps.version.outputs.version }}.dmg"
          codesign --sign "Developer ID Application" --timestamp --keychain "$RUNNER_TEMP/build.keychain" "$DMG"
          xcrun notarytool submit "$DMG" --apple-id "$APPLE_ID" \
            --password "$NOTARIZATION_PASSWORD" --team-id "$TEAM_ID" --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"

      - name: Create ZIP
        run: |
          cd "$RUNNER_TEMP/export"
          ditto -c -k --keepParent "$APP_NAME.app" "$RUNNER_TEMP/$APP_NAME-${{ steps.version.outputs.version }}.zip"

      - name: Sign and verify ZIP with Sparkle
        id: sparkle
        env:
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SIGN_UPDATE: ${{ runner.temp }}/ReleaseDerivedData/SourcePackages/artifacts/sparkle/Sparkle/bin/sign_update
        run: |
          bash scripts/sign-update.sh \
            "$RUNNER_TEMP/$APP_NAME-${{ steps.version.outputs.version }}.zip" \
            "$RUNNER_TEMP/export/$APP_NAME.app/Contents/Info.plist"

      - name: Retain crash symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Findle-symbols-${{ github.ref_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/Findle.xcarchive/dSYMs
          if-no-files-found: error
          retention-days: 90

      - name: Generate Sparkle appcast
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          BUILD="${{ github.run_number }}"
          ZIP_SIZE="${{ steps.sparkle.outputs.zip_size }}"
          ED_SIGNATURE="${{ steps.sparkle.outputs.ed_signature }}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%a, %d %b %Y %H:%M:%S %z")

          cat > "$RUNNER_TEMP/appcast.xml" <<APPCAST
          <?xml version="1.0" encoding="utf-8"?>
          <rss version="2.0" xmlns:sparkle="http://www.andymatuschak.org/xml-namespaces/sparkle" xmlns:dc="http://purl.org/dc/elements/1.1/">
            <channel>
              <title>Findle Updates</title>
              <language>en</language>
              <item>
                <title>Version ${VERSION}</title>
                <pubDate>${PUB_DATE}</pubDate>
                <sparkle:version>${BUILD}</sparkle:version>
                <sparkle:shortVersionString>${VERSION}</sparkle:shortVersionString>
                <sparkle:minimumSystemVersion>15.0</sparkle:minimumSystemVersion>
                <enclosure
                  url="https://github.com/${REPO}/releases/download/v${VERSION}/Findle-${VERSION}.zip"
                  length="${ZIP_SIZE}"
                  type="application/octet-stream"
                  sparkle:edSignature="${ED_SIGNATURE}"
                />
              </item>
            </channel>
          </rss>
          APPCAST

      - name: Assemble validated candidate
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ED_SIGNATURE: ${{ steps.sparkle.outputs.ed_signature }}
        run: |
          mkdir -p "$RUNNER_TEMP/candidate"
          cp "$RUNNER_TEMP/$APP_NAME-$VERSION.zip" "$RUNNER_TEMP/$APP_NAME-$VERSION.dmg" \
            "$RUNNER_TEMP/appcast.xml" "$RUNNER_TEMP/candidate/"
          cp Findle.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved "$RUNNER_TEMP/candidate/"
          ditto -c -k --keepParent "$RUNNER_TEMP/Findle.xcarchive/dSYMs" "$RUNNER_TEMP/candidate/Findle-symbols.zip"
          python3 scripts/release-candidate.py manifest --directory "$RUNNER_TEMP/candidate" \
            --version "$VERSION" --build "$GITHUB_RUN_NUMBER" --revision "$GITHUB_SHA" --signature "$ED_SIGNATURE"
          cd "$RUNNER_TEMP/candidate"
          shasum -a 256 ./* > "$RUNNER_TEMP/candidate-checksums.txt"
          cat "$RUNNER_TEMP/candidate-checksums.txt" >> "$GITHUB_STEP_SUMMARY"

      - name: Attest candidate provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: ${{ runner.temp }}/candidate/*

      - name: Verify generated attestations
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for artifact in "$RUNNER_TEMP"/candidate/*; do
            gh attestation verify "$artifact" --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" \
              --source-digest "$GITHUB_SHA" --deny-self-hosted-runners
          done

      - name: Retain complete candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-candidate-${{ github.ref_name }}-${{ github.run_id }}
          path: ${{ runner.temp }}/candidate
          if-no-files-found: error
          retention-days: 90

      - name: Stage draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/stage-release.py "$RUNNER_TEMP/candidate"

      - name: Clean up keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
