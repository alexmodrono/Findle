name: One-time release secret migration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: one-time-release-secret-migration
  cancel-in-progress: false

jobs:
  seal:
    if: github.repository == 'alexmodrono/Findle' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    steps:
      - name: Check out the reviewed main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1; verified tag
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python before injecting secrets
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0; verified tag
        with:
          python-version: '3.12'
          cache: ''
      - name: Install only hash-verified binary dependencies before injecting secrets
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/secret-migration-venv"
          "$RUNNER_TEMP/secret-migration-venv/bin/python" -m pip install \
            --disable-pip-version-check --no-cache-dir --no-deps --only-binary=:all: \
            --require-hashes -r scripts/secret-migration-requirements.txt
          "$RUNNER_TEMP/secret-migration-venv/bin/python" -I -m unittest discover \
            -s Tests/SecretMigrationTests -v
      - name: Seal exact values directly to their destination GitHub keys
        shell: bash
        env:
          SOURCE_APPLE_ID: ${{ secrets.APPLE_ID }}
          SOURCE_APP_PROVISION_PROFILE_BASE64: ${{ secrets.APP_PROVISION_PROFILE_BASE64 }}
          SOURCE_CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          SOURCE_CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          SOURCE_FILEPROVIDER_PROVISION_PROFILE_BASE64: ${{ secrets.FILEPROVIDER_PROVISION_PROFILE_BASE64 }}
          SOURCE_NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          SOURCE_SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
          SOURCE_TEAM_ID: ${{ secrets.TEAM_ID }}
          SOURCE_HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          ulimit -c 0
          "$RUNNER_TEMP/secret-migration-venv/bin/python" -I scripts/secret-migration.py seal \
            --output "$RUNNER_TEMP/secret-migration-ciphertext/manifest.json"
      - name: Upload ciphertext manifest only
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2; verified tag
        with:
          name: secret-migration-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/secret-migration-ciphertext/manifest.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          overwrite: false
