name: PR Nightly Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-nightly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_NAME: Findle Nightly
  SCHEME: Foodle-Nightly
  CONFIGURATION: Nightly

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Foodle.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO

      - name: Package app
        run: |
          APP_PATH=$(find "$RUNNER_TEMP/DerivedData" -name "$APP_NAME.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: $APP_NAME.app not found"
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/$APP_NAME.zip"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Findle-Nightly
          path: ${{ runner.temp }}/Findle Nightly.zip
          retention-days: 14
          if-no-files-found: error

      # A job summary works for forks and Dependabot without a PR write token.
      - name: Record download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "[Download Findle Nightly]($ARTIFACT_URL)"
            echo
            echo "Unsigned build of $GITHUB_SHA (the PR merge commit)."
            echo "File Provider registration and real SSO require a signed build."
            echo "Only open builds you trust. [Apple’s first-launch guidance](https://support.apple.com/102445)."
          } >> "$GITHUB_STEP_SUMMARY"
