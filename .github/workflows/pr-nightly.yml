name: PR Nightly Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-nightly-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  APP_NAME: Findle Nightly
  SCHEME: Findle-Nightly
  CONFIGURATION: Nightly
  DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check build prerequisites
        run: bash scripts/ci-preflight.sh

      - name: Install XcodeGen
        run: bash scripts/install-ci-tools.sh

      - name: Restore resolved package sources
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ runner.os }}-${{ runner.arch }}-xcode26.6-nightly-artifact-${{ hashFiles('Findle.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project Findle.xcodeproj \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/SourcePackages" \
            -disableAutomaticPackageResolution \
            FINDLE_SOURCE_REVISION="$GITHUB_SHA" \
            -onlyUsePackageVersionsFromResolvedFile \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: Package app
        run: |
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/$CONFIGURATION/$APP_NAME.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Error: $APP_NAME.app not found"
            exit 1
          fi
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/$APP_NAME.zip"

      - name: Upload artifact
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Findle-Nightly
          path: ${{ runner.temp }}/Findle Nightly.zip
          retention-days: 14
          if-no-files-found: error

      # A job summary works for forks and Dependabot without a PR write token.
      - name: Record download link
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        run: |
          {
            echo "[Download Findle Nightly]($ARTIFACT_URL)"
            echo
            echo "Unsigned build of $GITHUB_SHA (the PR merge commit)."
            echo "File Provider registration and real SSO require a signed build."
          } >> "$GITHUB_STEP_SUMMARY"
