name: Findle
options:
  bundleIdPrefix: es.amodrono.findle
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    FINDLE_SOURCE_REVISION: unknown
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_STRICT_CONCURRENCY: complete
    FINDLE_BUNDLE_PREFIX: es.amodrono.findle
    APP_GROUP_IDENTIFIER: group.es.amodrono.findle
    FINDLE_APPCAST_URL: https://github.com/alexmodrono/Findle/releases/latest/download/appcast.xml
    FINDLE_PERSONAL_FILES_FOLDER: "Findle Personal Files"
  configs:
    Nightly:
      FINDLE_BUNDLE_PREFIX: es.amodrono.findle.nightly
      APP_GROUP_IDENTIFIER: group.es.amodrono.findle.nightly
      # Nightly ships as an unsigned CI artifact and has no appcast of its own.
      # Leaving the release feed here would let a Nightly install "update"
      # itself into the production build. An empty feed disables Sparkle.
      FINDLE_APPCAST_URL: ""
      # Nightly is a separate installation with its own database, so it gets its
      # own personal files folder and never imports the release build's files.
      FINDLE_PERSONAL_FILES_FOLDER: "Findle Nightly Personal Files"

configs:
  Debug: debug
  Nightly: release
  Release: release

schemes:
  Findle-OnboardingPreview:
    build:
      targets:
        FindleOnboardingPreview: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnboardingPreviewTests
  Findle:
    build:
      targets:
        Findle: all
        FindleFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SharedDomainTests
        - NetworkingTests
        - FileProviderTests
        - PersistenceTests
        - SyncEngineTests
        - FindleMCPTests
        - AppInterfaceTests
        - OnboardingPreviewTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FindleMCP:
    build:
      targets:
        FindleMCP: all
    run:
      config: Debug
  Findle-Nightly:
    build:
      targets:
        Findle: all
        FindleFileProvider: all
    run:
      config: Nightly
    test:
      config: Nightly
      targets:
        - SharedDomainTests
        - NetworkingTests
        - FileProviderTests
        - PersistenceTests
        - SyncEngineTests
        - FindleMCPTests
        - AppInterfaceTests
        - OnboardingPreviewTests
    profile:
      config: Nightly
    analyze:
      config: Nightly
    archive:
      config: Nightly

packages:
  Airlock:
    url: https://github.com/alexmodrono/Airlock.git
    revision: 42f176a5718ba990afea49f2b45ee51e5e74674b
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.12.1

targets:
  # These targets share the actual setup views, but substitute sample-only
  # AppState and FinderWindowObserver types. Do not add Sources/App wholesale:
  # the production lifecycle, account storage, and File Provider stay excluded.
  FindleOnboardingPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/OnboardingPreview
      - path: Sources/App/Onboarding
      - path: Sources/App/Interface/NativeUI.swift
      - path: Sources/App/Settings/CourseSelectionView.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - package: Airlock
        product: Airlock
    settings:
      base:
        PRODUCT_NAME: Findle Onboarding Preview
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.onboarding-preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Findle Onboarding Preview
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/OnboardingPreview.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  OnboardingPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OnboardingPreviewTests
      - path: Sources/OnboardingPreview
        excludes:
          - OnboardingPreviewApp.swift
      - path: Sources/App/Onboarding
      - path: Sources/App/Interface/NativeUI.swift
      - path: Sources/App/Settings/CourseSelectionView.swift
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - package: Airlock
        product: Airlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.onboarding-preview-tests
        GENERATE_INFOPLIST_FILE: YES

  AppInterfaceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppInterfaceTests
      - path: Sources/App/Companion/FinderPanelPlacement.swift
      - path: Sources/App/Companion/FinderFolderResolver.swift
      - path: Sources/App/Companion/CompanionNode.swift
      - path: Sources/App/Companion/CompanionPresentation.swift
      - path: Sources/App/Companion/CompanionLocation.swift
      - path: Sources/App/Companion/CompanionDeadline.swift
      - path: Sources/App/Companion/CompanionSelection.swift
      - path: Sources/App/Companion/FinderWindowObserver.swift
      - path: Sources/App/Companion/CompanionFrameAnimator.swift
      - path: Sources/App/Companion/CompanionMotion.swift
      - path: Sources/App/Companion/CompanionPanel.swift
      - path: Sources/App/Services/LegacySettingsMigration.swift
      - path: Sources/App/Services/DiagnosticsReportBuilder.swift
      - path: Sources/App/Services/SyncReportPresentation.swift
      - path: Sources/App/Services/SpotlightIndexer.swift
      - path: Sources/App/Services/NotificationPlanner.swift
      - path: Sources/App/Services/DueThisWeek.swift
      - path: Sources/App/Services/SessionWorkCoordinator.swift
      - path: Sources/App/Services/ProviderResetCoordinator.swift
    dependencies:
      - target: SharedDomain
      - target: FindlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.interface-tests

  Findle:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug-App.xcconfig
      Nightly: Config/Nightly-App.xcconfig
      Release: Config/Release-App.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/App
      # Keep Downloaded and Remove Download work the same from the companion.
      - path: Sources/FileProviderExtension/DownloadRetention.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
      - target: FindleSyncEngine
      - target: FindleFileProvider
        embed: true
        codeSign: true
      - target: FindleWidgets
        embed: true
        codeSign: true
      - target: FindlePackagePreview
        embed: true
        codeSign: true
      - target: FindleFinderSync
        embed: true
        codeSign: true
      - target: FindleFinderUI
        embed: true
        codeSign: true
      - target: FindleThumbnails
        embed: true
        codeSign: true
      - target: FindleSpotlightImporter
        embed: true
        codeSign: true
      - target: FindleMCP
        copy:
          destination: executables
          codeSign: true
      - package: Airlock
        product: Airlock
      - package: Sparkle
        product: Sparkle
      - sdk: CoreSpotlight.framework
    settings:
      base:
        PRODUCT_NAME: Findle
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle
        INFOPLIST_FILE: Resources/Info/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/Findle.entitlements
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
      configs:
        Nightly:
          PRODUCT_NAME: Findle Nightly
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.nightly

  SharedDomain:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.shared-domain
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindleNetworking:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/Networking
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.networking
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindlePersistence:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/Persistence
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.persistence
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindleSyncEngine:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/SyncEngine
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.sync-engine
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindleFileProvider:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Debug-FileProvider.xcconfig
      Nightly: Config/Nightly-FileProvider.xcconfig
      Release: Config/Release-FileProvider.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/FileProviderExtension
      - path: Resources/Badges
        buildPhase: resources
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
      - target: FindleSyncEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.file-provider
        INFOPLIST_FILE: Resources/Info/FileProvider-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/FileProvider.entitlements
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
      configs:
        Nightly:
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.nightly.file-provider
    info:
      path: Resources/Info/FileProvider-Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: graduationcap
        FindlePersonalFilesFolderName: $(FINDLE_PERSONAL_FILES_FOLDER)
        # Badge images for NSFileProviderDecorations that macOS has no image for.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: $(FINDLE_BUNDLE_PREFIX).badge-image.new
            UTTypeDescription: Findle New Badge
            UTTypeConformsTo: [com.apple.icon-decoration.badge, com.apple.icon-decoration-position.trailing-bottom]
            UTTypeIconFile: NewBadge
          - UTTypeIdentifier: $(FINDLE_BUNDLE_PREFIX).badge-image.updated
            UTTypeDescription: Findle Updated Badge
            UTTypeConformsTo: [com.apple.icon-decoration.badge, com.apple.icon-decoration-position.trailing-bottom]
            UTTypeIconFile: UpdatedBadge
          - UTTypeIdentifier: $(FINDLE_BUNDLE_PREFIX).badge-image.due-soon
            UTTypeDescription: Findle Due Soon Badge
            UTTypeConformsTo: [com.apple.icon-decoration.badge, com.apple.icon-decoration-position.trailing-bottom]
            UTTypeIconFile: DueSoonBadge
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionFileProviderDocumentGroup: "$(APP_GROUP_IDENTIFIER)"
          NSExtensionFileProviderSupportsEnumeration: true
          # Items list them most pressing first (FinderBadges), and Finder draws
          # the first. The labels show in Get Info, list view and VoiceOver.
          NSFileProviderDecorations:
            - Identifier: $(FINDLE_BUNDLE_PREFIX).badge.due-soon
              BadgeImageType: $(FINDLE_BUNDLE_PREFIX).badge-image.due-soon
              Category: Badge
              Label: Due soon
            - Identifier: $(FINDLE_BUNDLE_PREFIX).badge.new
              BadgeImageType: $(FINDLE_BUNDLE_PREFIX).badge-image.new
              Category: Badge
              Label: New
            - Identifier: $(FINDLE_BUNDLE_PREFIX).badge.updated
              BadgeImageType: $(FINDLE_BUNDLE_PREFIX).badge-image.updated
              Category: Badge
              Label: Updated
            - Identifier: $(FINDLE_BUNDLE_PREFIX).badge.completed
              BadgeImageType: com.apple.icon-decoration.badge.checkmark
              Category: Badge
              Label: Done
            - Identifier: $(FINDLE_BUNDLE_PREFIX).badge.kept
              BadgeImageType: com.apple.icon-decoration.badge.pinned
              Category: Badge
              Label: Kept downloaded
          # Each rule reads the state items publish in userInfo (FinderActionState) and
          # hides the action where it does nothing; FinderActionRuleTests evaluates them.
          # Items Finder cached before they published any state (kind == nil) keep
          # every action, as before.
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.sync-now
              NSExtensionFileProviderActionName: Sync Now
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.open-in-moodle
              NSExtensionFileProviderActionName: Open in Moodle
              NSExtensionFileProviderActionActivationRule: 'fileproviderItems.@count == 1 AND SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == nil OR $item.userInfo.kind == "root" OR $item.userInfo.moodle == YES).@count == 1'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.copy-moodle-link
              NSExtensionFileProviderActionName: Copy Moodle Link
              NSExtensionFileProviderActionActivationRule: 'fileproviderItems.@count == 1 AND SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == nil OR $item.userInfo.kind == "root" OR $item.userInfo.moodle == YES).@count == 1'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.open-course-page
              NSExtensionFileProviderActionName: Open Course Page
              NSExtensionFileProviderActionActivationRule: 'fileproviderItems.@count == 1 AND SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == nil OR ($item.userInfo.moodle == YES AND ($item.userInfo.kind == "folder" OR $item.userInfo.kind == "file"))).@count == 1'
            # On a course folder, keeping it downloaded is keeping the course offline.
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.keep-downloaded
              NSExtensionFileProviderActionName: Keep Downloaded
              NSExtensionFileProviderActionActivationRule: 'SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == nil OR ($item.userInfo.moodle == YES AND $item.userInfo.kept == NO AND $item.userInfo.kind != "course")).@count > 0'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.keep-course-offline
              NSExtensionFileProviderActionName: Keep Course Offline
              NSExtensionFileProviderActionActivationRule: 'SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == nil OR ($item.userInfo.moodle == YES AND $item.userInfo.kept == NO AND $item.userInfo.kind == "course")).@count > 0'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.remove-download
              NSExtensionFileProviderActionName: Remove Download
              NSExtensionFileProviderActionActivationRule: 'SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == nil OR $item.userInfo.kept == YES).@count > 0'
            # Only activities set to manual completion can be ticked off by the user.
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.mark-done
              NSExtensionFileProviderActionName: Mark as Done
              NSExtensionFileProviderActionActivationRule: 'SUBQUERY(fileproviderItems, $item, $item.userInfo.completion == "todo").@count > 0'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.mark-not-done
              NSExtensionFileProviderActionName: Mark as Not Done
              NSExtensionFileProviderActionActivationRule: 'SUBQUERY(fileproviderItems, $item, $item.userInfo.completion == "done").@count > 0'
            # Files Moodle replaced after the user downloaded them keep their previous version.
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.show-previous-version
              NSExtensionFileProviderActionName: Show Previous Version
              NSExtensionFileProviderActionActivationRule: 'fileproviderItems.@count == 1 AND SUBQUERY(fileproviderItems, $item, $item.userInfo.previous == YES).@count == 1'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.discard-previous-version
              NSExtensionFileProviderActionName: Discard Previous Version
              NSExtensionFileProviderActionActivationRule: 'SUBQUERY(fileproviderItems, $item, $item.userInfo.previous == YES).@count > 0'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.show-in-findle
              NSExtensionFileProviderActionName: Show in Findle
              NSExtensionFileProviderActionActivationRule: 'fileproviderItems.@count == 1 AND SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == nil OR $item.userInfo.moodle == YES).@count == 1'
          # Moodle items can't be deleted, renamed or moved (their capabilities say
          # so). These alerts tell the user why and what to do instead. They match
          # only items that published personal == NO, so personal files and items
          # Finder cached before publishing any state never see them.
          NSFileProviderUserInteractions:
            - ActivationRule: '(action == "Trash" OR action == "Delete") AND sourceItem.userInfo.personal == NO AND NOT sourceItem.userInfo.kind IN {"root", "collection", "link"}'
              Alert:
                LocalizedTitle: Files from Moodle can’t be deleted
                LocalizedSubTitle: Findle shows each course as it is on Moodle, so its files and folders stay until Moodle removes them. To free space on your Mac, choose Remove Download. The file stays here and downloads again when you open it.
                LocalizedRecoveryOptions:
                  Cancel: OK
                RecoveryOptions:
                  Continue: false
            - ActivationRule: 'action == "Rename" AND sourceItem.userInfo.personal == NO AND NOT sourceItem.userInfo.kind IN {"root", "collection", "link"}'
              Alert:
                LocalizedTitle: Files from Moodle can’t be renamed
                LocalizedSubTitle: Their names come from Moodle and follow any change made there. To keep your own copy under another name, hold Option while you drag it to make a copy, then rename the copy.
                LocalizedRecoveryOptions:
                  Cancel: OK
                RecoveryOptions:
                  Continue: false
            - ActivationRule: '(action == "Move" OR action == "MoveOut") AND sourceItem.userInfo.personal == NO AND NOT sourceItem.userInfo.kind IN {"root", "collection", "link"}'
              Alert:
                LocalizedTitle: Files from Moodle can’t be moved
                LocalizedSubTitle: They stay where they are in the course on Moodle. To put a copy somewhere else, hold Option while you drag it.
                LocalizedRecoveryOptions:
                  Cancel: OK
                RecoveryOptions:
                  Continue: false
            # Collections (Recently Added, Due This Week, Kept Offline) update themselves.
            - ActivationRule: '(action == "Trash" OR action == "Delete" OR action == "Rename" OR action == "Move" OR action == "MoveOut") AND sourceItem.userInfo.kind IN {"collection", "link"}'
              Alert:
                LocalizedTitle: Findle keeps this folder up to date
                LocalizedSubTitle: It gathers items from your courses, and they leave it on their own, for example once you open a new file or remove a download. The items themselves stay in their courses.
                LocalizedRecoveryOptions:
                  Cancel: OK
                RecoveryOptions:
                  Continue: false

  # The desktop widget (deadlines, new files) and the Sync Findle control. It
  # reads only the snapshot the app writes to the App Group container.
  FindleWidgets:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Debug-Widgets.xcconfig
      Nightly: Config/Nightly-Widgets.xcconfig
      Release: Config/Release-Widgets.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/Widgets
    dependencies:
      - target: SharedDomain
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.widgets
        INFOPLIST_FILE: Resources/Info/Widgets-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/Widgets.entitlements
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
      configs:
        Nightly:
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.nightly.widgets
    info:
      path: Resources/Info/Widgets-Info.plist
      properties:
        CFBundleDisplayName: Findle
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension

  # Findle's sheets in Finder: Reconnect when the session expires. It needs no
  # App Group or keychain; the app signs in and tells it when it's done.
  FindleFinderUI:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Debug-FinderUI.xcconfig
      Nightly: Config/Nightly-FinderUI.xcconfig
      Release: Config/Release-FinderUI.xcconfig
    sources:
      - path: Sources/FinderUI
    dependencies:
      - target: SharedDomain
      - sdk: FileProviderUI.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.file-provider-ui
        INFOPLIST_FILE: Resources/Info/FinderUI-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/FinderUI.entitlements
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
      configs:
        Nightly:
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.nightly.file-provider-ui
    info:
      path: Resources/Info/FinderUI-Info.plist
      properties:
        CFBundleDisplayName: Findle
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-actionsui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FinderSheetController"
          # Actions that open a sheet live here; FinderActionRuleTests reads them too.
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.course-info
              NSExtensionFileProviderActionName: Course Info
              NSExtensionFileProviderActionActivationRule: 'fileproviderItems.@count == 1 AND SUBQUERY(fileproviderItems, $item, $item.userInfo.kind == "course" AND $item.userInfo.moodle == YES).@count == 1'
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.assignment-details
              NSExtensionFileProviderActionName: Assignment Details
              NSExtensionFileProviderActionActivationRule: 'fileproviderItems.@count == 1 AND SUBQUERY(fileproviderItems, $item, $item.userInfo.assignment == YES).@count == 1'

  # The Findle button for Finder's toolbar. It reads only the snapshot the app
  # writes to the App Group container and opens findle:// links.
  FindleFinderSync:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Debug-FinderSync.xcconfig
      Nightly: Config/Nightly-FinderSync.xcconfig
      Release: Config/Release-FinderSync.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/FinderSync
    dependencies:
      - target: SharedDomain
      - sdk: FinderSync.framework
