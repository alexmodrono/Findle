name: Foodle
options:
  bundleIdPrefix: es.amodrono.foodle
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_STRICT_CONCURRENCY: complete
    FOODLE_BUNDLE_PREFIX: es.amodrono.foodle
    APP_GROUP_IDENTIFIER: group.es.amodrono.foodle
  configs:
    Nightly:
      FOODLE_BUNDLE_PREFIX: es.amodrono.foodle.nightly
      APP_GROUP_IDENTIFIER: group.es.amodrono.foodle.nightly

configs:
  Debug: debug
  Nightly: release
  Release: release

schemes:
  Foodle:
    build:
      targets:
        Foodle: all
        FoodleFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SharedDomainTests
        - NetworkingTests
        - FileProviderTests
        - PersistenceTests
        - SyncEngineTests
        - FindleMCPTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FindleMCP:
    build:
      targets:
        FindleMCP: all
    run:
      config: Debug
  Foodle-Nightly:
    build:
      targets:
        Foodle: all
        FoodleFileProvider: all
    run:
      config: Nightly
    test:
      config: Nightly
      targets:
        - SharedDomainTests
        - NetworkingTests
        - FileProviderTests
        - PersistenceTests
        - SyncEngineTests
        - FindleMCPTests
    profile:
      config: Nightly
    analyze:
      config: Nightly
    archive:
      config: Nightly

packages:
  Airlock:
    url: https://github.com/alexmodrono/Airlock
    from: 0.2.1
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0
  WhatsNewKit:
    url: https://github.com/SvenTiigi/WhatsNewKit
    from: 2.2.1
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.12.1

targets:
  Foodle:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug-App.xcconfig
      Nightly: Config/Nightly-App.xcconfig
      Release: Config/Release-App.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: SharedDomain
      - target: FoodleNetworking
      - target: FoodlePersistence
      - target: FoodleSyncEngine
      - target: FoodleFileProvider
        embed: true
        codeSign: true
      - target: FindleMCP
        copy:
          destination: executables
          codeSign: true
      - package: Airlock
        product: Airlock
      - package: Sparkle
        product: Sparkle
      - sdk: CoreSpotlight.framework
    settings:
      base:
        PRODUCT_NAME: Findle
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle
        INFOPLIST_FILE: Resources/Info/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/Foodle.entitlements
        ENABLE_APP_SANDBOX: YES
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
      configs:
        Nightly:
          PRODUCT_NAME: Findle Nightly
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.nightly

  SharedDomain:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.shared-domain
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
        CODE_SIGN_IDENTITY: "-"

  FoodleNetworking:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/Networking
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.networking
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
        CODE_SIGN_IDENTITY: "-"

  FoodlePersistence:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/Persistence
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.persistence
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
        CODE_SIGN_IDENTITY: "-"

  FoodleSyncEngine:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/SyncEngine
    dependencies:
      - target: SharedDomain
      - target: FoodleNetworking
      - target: FoodlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.sync-engine
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
        CODE_SIGN_IDENTITY: "-"

  FoodleFileProvider:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Debug-FileProvider.xcconfig
      Nightly: Config/Nightly-FileProvider.xcconfig
      Release: Config/Release-FileProvider.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/FileProviderExtension
    dependencies:
      - target: SharedDomain
      - target: FoodleNetworking
      - target: FoodlePersistence
      - target: FoodleSyncEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.file-provider
        INFOPLIST_FILE: Resources/Info/FileProvider-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/FileProvider.entitlements
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
      configs:
        Nightly:
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.nightly.file-provider
    info:
      path: Resources/Info/FileProvider-Info.plist
      properties:
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: graduationcap
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionFileProviderDocumentGroup: "$(APP_GROUP_IDENTIFIER)"
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: $(FOODLE_BUNDLE_PREFIX).action.open-in-moodle
              NSExtensionFileProviderActionName: Open in Moodle
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FOODLE_BUNDLE_PREFIX).action.copy-moodle-link
              NSExtensionFileProviderActionName: Copy Moodle Link
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FOODLE_BUNDLE_PREFIX).action.open-course-page
              NSExtensionFileProviderActionName: Open Course Page
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FOODLE_BUNDLE_PREFIX).action.keep-downloaded
              NSExtensionFileProviderActionName: Keep Downloaded
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FOODLE_BUNDLE_PREFIX).action.remove-download
              NSExtensionFileProviderActionName: Remove Download
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE

  FindleMCP:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/MCP.xcconfig
      Nightly: Config/MCP.xcconfig
      Release: Config/MCP.xcconfig
    sources:
      - path: Sources/FindleMCP
    dependencies:
      - target: SharedDomain
      - target: FoodlePersistence
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.mcp
        # Inherit the team signing identity (no ad-hoc override) so the bundled
        # helper's Team ID matches the app's frameworks — otherwise the hardened
        # runtime's library validation refuses to load them (different Team IDs).
        # Find the linked frameworks both standalone (next to the binary in the
        # build products dir) and when bundled into the app as a helper, where
        # they live in the app's Contents/Frameworks.
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path"
          - "@executable_path/../Frameworks"

  SharedDomainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SharedDomainTests
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.shared-domain-tests

  NetworkingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NetworkingTests
    dependencies:
      - target: FoodleNetworking
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.networking-tests

  PersistenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PersistenceTests
    dependencies:
      - target: FoodlePersistence
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.persistence-tests

  FileProviderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FileProviderTests
      - path: Sources/FileProviderExtension/FileDownloader.swift
      - path: Sources/FileProviderExtension/FileProviderItem.swift
    dependencies:
      - target: SharedDomain
      - target: FoodleNetworking
      - target: FoodlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.file-provider-tests

  SyncEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SyncEngineTests
    dependencies:
      - target: FoodleSyncEngine
      - target: SharedDomain
      - target: FoodleNetworking
      - target: FoodlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.sync-engine-tests

  FindleMCPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Compile the MCP logic into the test bundle (the @main entry is excluded).
      - path: Sources/FindleMCP
        excludes:
          - FindleMCP.swift
      - path: Tests/FindleMCPTests
    dependencies:
      - target: SharedDomain
      - target: FoodlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.foodle.mcp-tests
