name: Findle
options:
  bundleIdPrefix: es.amodrono.findle
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  groupSortPosition: top
  generateEmptyDirectories: true
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38"

settings:
  base:
    SWIFT_VERSION: "6.0"
    CURRENT_PROJECT_VERSION: "1"
    FINDLE_SOURCE_REVISION: unknown
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: true
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "Apple Development"
    SWIFT_STRICT_CONCURRENCY: complete
    FINDLE_BUNDLE_PREFIX: es.amodrono.findle
    APP_GROUP_IDENTIFIER: group.es.amodrono.findle
    FINDLE_APPCAST_URL: https://github.com/alexmodrono/Findle/releases/latest/download/appcast.xml
    FINDLE_PERSONAL_FILES_FOLDER: "Findle Personal Files"
  configs:
    Nightly:
      FINDLE_BUNDLE_PREFIX: es.amodrono.findle.nightly
      APP_GROUP_IDENTIFIER: group.es.amodrono.findle.nightly
      # Nightly ships as an unsigned CI artifact and has no appcast of its own.
      # Leaving the release feed here would let a Nightly install "update"
      # itself into the production build. An empty feed disables Sparkle.
      FINDLE_APPCAST_URL: ""
      # Nightly is a separate installation with its own database, so it gets its
      # own personal files folder and never imports the release build's files.
      FINDLE_PERSONAL_FILES_FOLDER: "Findle Nightly Personal Files"

configs:
  Debug: debug
  Nightly: release
  Release: release

schemes:
  Findle-OnboardingPreview:
    build:
      targets:
        FindleOnboardingPreview: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - OnboardingPreviewTests
  Findle:
    build:
      targets:
        Findle: all
        FindleFileProvider: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SharedDomainTests
        - NetworkingTests
        - FileProviderTests
        - PersistenceTests
        - SyncEngineTests
        - FindleMCPTests
        - AppInterfaceTests
        - OnboardingPreviewTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  FindleMCP:
    build:
      targets:
        FindleMCP: all
    run:
      config: Debug
  Findle-Nightly:
    build:
      targets:
        Findle: all
        FindleFileProvider: all
    run:
      config: Nightly
    test:
      config: Nightly
      targets:
        - SharedDomainTests
        - NetworkingTests
        - FileProviderTests
        - PersistenceTests
        - SyncEngineTests
        - FindleMCPTests
        - AppInterfaceTests
        - OnboardingPreviewTests
    profile:
      config: Nightly
    analyze:
      config: Nightly
    archive:
      config: Nightly

packages:
  Airlock:
    url: https://github.com/alexmodrono/Airlock.git
    revision: 3a658ad5ecf79173154b55706f8f17c42263d233
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.10.1
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    from: 0.12.1

targets:
  # These targets share the actual setup views, but substitute sample-only
  # AppState and FinderWindowObserver types. Do not add Sources/App wholesale:
  # the production lifecycle, account storage, and File Provider stay excluded.
  FindleOnboardingPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/OnboardingPreview
      - path: Sources/App/Onboarding
      - path: Sources/App/Interface/NativeUI.swift
      - path: Sources/App/Settings/CourseSelectionView.swift
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - package: Airlock
        product: Airlock
    settings:
      base:
        PRODUCT_NAME: Findle Onboarding Preview
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.onboarding-preview
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Findle Onboarding Preview
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/OnboardingPreview.entitlements
        ENABLE_APP_SANDBOX: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"

  OnboardingPreviewTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/OnboardingPreviewTests
      - path: Sources/OnboardingPreview
        excludes:
          - OnboardingPreviewApp.swift
      - path: Sources/App/Onboarding
      - path: Sources/App/Interface/NativeUI.swift
      - path: Sources/App/Settings/CourseSelectionView.swift
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - package: Airlock
        product: Airlock
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.onboarding-preview-tests
        GENERATE_INFOPLIST_FILE: YES

  AppInterfaceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/AppInterfaceTests
      - path: Sources/App/Companion/FinderPanelPlacement.swift
      - path: Sources/App/Companion/FinderFolderResolver.swift
      - path: Sources/App/Companion/CompanionNode.swift
      - path: Sources/App/Companion/CompanionPresentation.swift
      - path: Sources/App/Companion/FinderWindowObserver.swift
      - path: Sources/App/Companion/CompanionFrameAnimator.swift
      - path: Sources/App/Companion/CompanionMotion.swift
      - path: Sources/App/Companion/CompanionPanel.swift
      - path: Sources/App/Services/LegacySettingsMigration.swift
      - path: Sources/App/Services/DiagnosticsReportBuilder.swift
      - path: Sources/App/Services/SyncReportPresentation.swift
      - path: Sources/App/Services/SessionWorkCoordinator.swift
      - path: Sources/App/Services/ProviderResetCoordinator.swift
    dependencies:
      - target: SharedDomain
      - target: FindlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.interface-tests

  Findle:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Debug-App.xcconfig
      Nightly: Config/Nightly-App.xcconfig
      Release: Config/Release-App.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/App
      - path: Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
      - target: FindleSyncEngine
      - target: FindleFileProvider
        embed: true
        codeSign: true
      - target: FindleMCP
        copy:
          destination: executables
          codeSign: true
      - package: Airlock
        product: Airlock
      - package: Sparkle
        product: Sparkle
      - sdk: CoreSpotlight.framework
    settings:
      base:
        PRODUCT_NAME: Findle
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle
        INFOPLIST_FILE: Resources/Info/App-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/Findle.entitlements
        ENABLE_APP_SANDBOX: NO
        COMBINE_HIDPI_IMAGES: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
      configs:
        Nightly:
          PRODUCT_NAME: Findle Nightly
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.nightly

  SharedDomain:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.shared-domain
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindleNetworking:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/Networking
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.networking
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindlePersistence:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/Persistence
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.persistence
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindleSyncEngine:
    type: framework
    platform: macOS
    configFiles:
      Nightly: Config/Nightly-Framework.xcconfig
      Release: Config/Release-Framework.xcconfig
    sources:
      - path: Sources/SyncEngine
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.sync-engine
        INFOPLIST_FILE: Resources/Info/Framework-Info.plist
      configs:
        Debug:
          CODE_SIGN_IDENTITY: "-"
        Nightly:
          CODE_SIGN_IDENTITY: "-"

  FindleFileProvider:
    type: app-extension
    platform: macOS
    configFiles:
      Debug: Config/Debug-FileProvider.xcconfig
      Nightly: Config/Nightly-FileProvider.xcconfig
      Release: Config/Release-FileProvider.xcconfig
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.Mac:
          enabled: 1
    sources:
      - path: Sources/FileProviderExtension
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
      - target: FindleSyncEngine
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.file-provider
        INFOPLIST_FILE: Resources/Info/FileProvider-Info.plist
        CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/FileProvider.entitlements
        ENABLE_APP_SANDBOX: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path/../Frameworks"
          - "@executable_path/../../../../Frameworks"
      configs:
        Nightly:
          PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.nightly.file-provider
    info:
      path: Resources/Info/FileProvider-Info.plist
      properties:
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleSymbolName: graduationcap
        FindlePersonalFilesFolderName: $(FINDLE_PERSONAL_FILES_FOLDER)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.fileprovider-nonui
          NSExtensionPrincipalClass: "$(PRODUCT_MODULE_NAME).FileProviderExtension"
          NSExtensionFileProviderDocumentGroup: "$(APP_GROUP_IDENTIFIER)"
          NSExtensionFileProviderSupportsEnumeration: true
          NSExtensionFileProviderActions:
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.sync-now
              NSExtensionFileProviderActionName: Sync Now
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.open-in-moodle
              NSExtensionFileProviderActionName: Open in Moodle
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.copy-moodle-link
              NSExtensionFileProviderActionName: Copy Moodle Link
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.open-course-page
              NSExtensionFileProviderActionName: Open Course Page
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.keep-downloaded
              NSExtensionFileProviderActionName: Keep Downloaded
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE
            - NSExtensionFileProviderActionIdentifier: $(FINDLE_BUNDLE_PREFIX).action.remove-download
              NSExtensionFileProviderActionName: Remove Download
              NSExtensionFileProviderActionActivationRule: TRUEPREDICATE

  FindleMCP:
    type: tool
    platform: macOS
    configFiles:
      Debug: Config/MCP.xcconfig
      Nightly: Config/MCP.xcconfig
      Release: Config/Release-MCP.xcconfig
    sources:
      - path: Sources/FindleMCP
    dependencies:
      - target: SharedDomain
      - target: FindlePersistence
      - package: MCP
        product: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.mcp
        # The helper ships only as an embedded copy inside the app (via the app's
        # copy phase). Without this, the tool also installs to the archive's
        # Products/usr/local/bin, making the archive multi-product: Xcode then
        # omits ApplicationProperties and -exportArchive fails to determine a
        # distribution method ("Unknown Distribution Error").
        SKIP_INSTALL: true
        # Inherit the team signing identity (no ad-hoc override) so the bundled
        # helper's Team ID matches the app's frameworks — otherwise the hardened
        # runtime's library validation refuses to load them (different Team IDs).
        # Find the linked frameworks both standalone (next to the binary in the
        # build products dir) and when bundled into the app as a helper, where
        # they live in the app's Contents/Frameworks.
        LD_RUNPATH_SEARCH_PATHS:
          - "@executable_path"
          - "@executable_path/../Frameworks"

  SharedDomainTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SharedDomainTests
    dependencies:
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.shared-domain-tests

  NetworkingTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/NetworkingTests
    dependencies:
      - target: FindleNetworking
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.networking-tests

  PersistenceTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PersistenceTests
    dependencies:
      - target: FindlePersistence
      - target: SharedDomain
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.persistence-tests

  FileProviderTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/FileProviderTests
      - path: Sources/FileProviderExtension/FileDownloader.swift
      - path: Sources/FileProviderExtension/FileProviderItem.swift
      - path: Sources/FileProviderExtension/ItemEnumerator.swift
      - path: Sources/FileProviderExtension/ProviderAccess.swift
      - path: Sources/FileProviderExtension/DownloadPublication.swift
      - path: Sources/FileProviderExtension/SyncedItemModification.swift
    dependencies:
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.file-provider-tests

  SyncEngineTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/SyncEngineTests
    dependencies:
      - target: FindleSyncEngine
      - target: SharedDomain
      - target: FindleNetworking
      - target: FindlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.sync-engine-tests

  FindleMCPTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      # Compile the MCP logic into the test bundle (the @main entry is excluded).
      - path: Sources/FindleMCP
        excludes:
          - FindleMCP.swift
      - path: Tests/FindleMCPTests
    dependencies:
      - target: SharedDomain
      - target: FindlePersistence
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: es.amodrono.findle.mcp-tests
